<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی منچ آنلاین (P2P)</title>
    <script src="https://manch-server.onrender.com/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #06C755; margin-bottom: 15px; font-size: 24px; }
        .card { background: #16213e; padding: 20px; border-radius: 15px; max-width: 450px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .id-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #06C755; font-size: 20px; font-weight: bold; color: #06C755; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px; }
        button { background: #06C755; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { font-size: 14px; color: #94a3b8; margin-top: 10px; }
        .hidden { display: none !important; }

        /* --- استایل صفحه منچ --- */
        .board-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #0f172a; padding: 10px; border-radius: 10px; margin-top: 10px; }
        .cell { width: 60px; height: 60px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 1px solid #334155; transition: 0.2s; }
        
        /* رنگ خانه‌ها */
        .cell.p1-home { background: #06C755; }
        .cell.p2-home { background: #ef4444; }
        .cell.path { background: #334155; }
        .cell:hover { filter: brightness(1.3); }

        /* مهره‌ها */
        .piece { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; }
        .piece.p1 { background: #05a648; border: 2px solid white; box-shadow: 0 0 10px #06C755; }
        .piece.p2 { background: #dc2626; border: 2px solid white; box-shadow: 0 0 10px #ef4444; }

        /* بخش تاس */
        .dice-area { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
        .dice { width: 60px; height: 60px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: black; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #turn-text { font-size: 18px; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>

    <h1>🎲 بازی منچ آنلاین</h1>

    <!-- منوی اتصال -->
    <div class="card" id="main-menu">
        <h2>اتصال به حریف</h2>
        <p>آیدی شما:</p>
        <div id="my-id" class="id-box">...</div>
        <div id="connect-section">
            <input type="text" id="opponent-id" placeholder="آیدی حریف (مثلا 1234)" maxlength="4">
            <button onclick="sendRequest()">ارسال درخواست</button>
        </div>
        <div id="accept-section" class="hidden">
            <p style="color: #fbbf24; margin-bottom: 10px;">درخواست از طرف <span id="req-id"></span>!</p>
            <button onclick="acceptRequest()">قبول درخواست</button>
        </div>
        <div id="status">در حال اتصال...</div>
    </div>

    <!-- صفحه بازی -->
    <div class="card hidden" id="game-area">
        <div id="turn-text">نوبت شماست!</div>
        
        <div class="board-container" id="game-board"></div>
        
        <div class="dice-area">
            <button onclick="rollDice()" id="roll-btn">انداختن تاس</button>
            <div class="dice" id="dice-display">?</div>
        </div>
        <div id="game-msg" style="color: #94a3b8; font-size: 14px; margin-top: 10px;"></div>
    </div>

    <script>
        const socket = io("https://manch-server.onrender.com");
        let myId = null;
        let requesterId = null;
        let isMyTurn = false;
        let myPlayerNumber = 1; 
        let currentDice = 0;
        let lastRolled = false;

        // تعریف ۲۵ خانه (۵ در ۵) 
        // خانه‌های ۰ تا ۴ (ردیف اول) خانه بازیکن ۱
        // خانه‌های ۲۰ تا ۲۴ (ردیف آخر) خانه بازیکن ۲
        // بقیه مسیر معمولی
        const board = document.getElementById('game-board');
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (i < 5) cell.classList.add('p1-home');
            else if (i >= 20) cell.classList.add('p2-home');
            else cell.classList.add('path');
            cell.dataset.index = i;
            cell.addEventListener('click', () => makeMove(i));
            board.appendChild(cell);
        }

        // آیدی و اتصال
        socket.on('your-id', (id) => {
            myId = id;
            document.getElementById('my-id').innerText = id;
            document.getElementById('status').innerText = "آماده. آیدی خود را به دوستتان بدهید.";
        });

        function sendRequest() {
            const opId = document.getElementById('opponent-id').value.trim();
            if (opId) socket.emit('request-connect', opId);
        }

        socket.on('incoming-request', (data) => {
            requesterId = data.from;
            document.getElementById('req-id').innerText = data.from;
            document.getElementById('connect-section').classList.add('hidden');
            document.getElementById('accept-section').classList.remove('hidden');
        });

        function acceptRequest() {
            socket.emit('accept-connect', requesterId);
        }

        // شروع بازی
        socket.on('game-started', (data) => {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            
            if (data.requester === myId) {
                myPlayerNumber = 1;
                isMyTurn = true;
                document.getElementById('turn-text').innerText = "شما بازیکن ۱ (سبز) هستید. تاس بیندازید!";
                document.getElementById('roll-btn').disabled = false;
            } else {
                myPlayerNumber = 2;
                isMyTurn = false;
                document.getElementById('turn-text').innerText = "شما بازیکن ۲ (قرمز) هستید. منتظر حریف...";
                document.getElementById('roll-btn').disabled = true;
            }
        });

        // انداختن تاس (فقط لوکال - برای تست)
        function rollDice() {
            if (!isMyTurn || lastRolled) return;
            currentDice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-display').innerText = currentDice;
            document.getElementById('game-msg').innerText = `شما ${currentDice} آوردید. یک مهره را حرکت دهید.`;
            lastRolled = true;
            document.getElementById('roll-btn').disabled = true;
            
            // ارسال نتیجه تاس به حریف
            socket.emit('dice-rolled', { dice: currentDice });
        }

        // دریافت تاس حریف
        socket.on('opponent-dice', (data) => {
            document.getElementById('dice-display').innerText = data.dice;
            document.getElementById('game-msg').innerText = `حریف ${data.dice} آورد. منتظر حرکتش باشید...`;
        });

        // حرکت دادن مهره
        function makeMove(index) {
            if (!isMyTurn || !lastRolled) return; 
            
            // فقط اجازه حرکت در خانه‌های خالی
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            if (cell.querySelector('.piece')) return alert("این خانه پر است!");

            // اعمال حرکت روی صفحه خودم
            applyMove(index, myPlayerNumber);
            
            // ارسال حرکت به سرور
            socket.emit('make-move', { index: index, player: myPlayerNumber });
            
            // پایان نوبت
            isMyTurn = false;
            lastRolled = false;
            document.getElementById('turn-text').innerText = "منتظر حرکت حریف...";
            document.getElementById('roll-btn').disabled = true;
        }

        // دریافت حرکت حریف
        socket.on('opponent-move', (data) => {
            applyMove(data.index, data.player);
            isMyTurn = true;
            lastRolled = false;
            document.getElementById('turn-text').innerText = "نوبت شماست! تاس بیندازید.";
            document.getElementById('roll-btn').disabled = false;
        });

        // رسم مهره
        function applyMove(index, playerNumber) {
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            const piece = document.createElement('div');
            piece.classList.add('piece');
            if (playerNumber === 1) {
                piece.classList.add('p1');
                piece.innerText = '1';
            } else {
                piece.classList.add('p2');
                piece.innerText = '2';
            }
            cell.appendChild(piece);
        }
    </script>
</body>
</html>
