<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست اتصال منچ</title>
    <script src="https://manch-server.onrender.com/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Tahoma; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 20px; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #334155; }
        .status { font-weight: bold; color: yellow; margin-bottom: 20px; }
        .success { color: #06C755; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h2>تست اتصال</h2>
    <div class="status" id="conn-status">در حال اتصال به سرور...</div>
    
    <div class="box">
        <h3>آیدی شما:</h3>
        <div id="my-id" style="font-size: 24px; color: #06C755; font-weight: bold;">---</div>
    </div>

    <div class="box">
        <h3>کاربران آنلاین:</h3>
        <ul id="users-list">
            <li>در حال دریافت...</li>
        </ul>
    </div>

    <script>
        function getPersistentId() {
            let id = localStorage.getItem('manchPlayerId');
            if (!id) { id = Math.floor(1000 + Math.random() * 9000).toString(); localStorage.setItem('manchPlayerId', id); }
            return id;
        }
        const myId = getPersistentId();
        
        // اتصال به سرور
        const socket = io("https://manch-server.onrender.com");

        socket.on('connect', () => {
            document.getElementById('conn-status').innerText = "✅ متصل به سرور شد!";
            document.getElementById('conn-status').className = "status success";
            document.getElementById('my-id').innerText = myId;
            
            // ثبت نام با آیدی ثابت
            socket.emit('register-user', myId);
        });

        socket.on('connect_error', (err) => {
            document.getElementById('conn-status').innerText = "❌ خطا: " + err.message;
            document.getElementById('conn-status').className = "status error";
        });

        // دریافت لیست کاربران آنلاین
        socket.on('online-users-list', (users) => {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            let found = false;
            users.forEach(u => {
                if (u.id !== myId) {
                    found = true;
                    const li = document.createElement('li');
                    li.innerText = `بازیکن ${u.id} (${u.status})`;
                    list.appendChild(li);
                }
            });
            if (!found) {
                list.innerHTML = '<li style="color: #94a3b8;">هیچ کاربر دیگری آنلاین نیست.</li>';
            }
        });
    </script>
</body>
</html>
