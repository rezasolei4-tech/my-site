<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی منچ آنلاین</title>
    <script src="https://manch-server.onrender.com/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; }
        h1 { color: #06C755; margin-bottom: 10px; font-size: 20px; }
        
        .card { background: #16213e; padding: 15px; border-radius: 10px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center; }
        .hidden { display: none !important; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; text-align: center; font-size: 16px; }
        button { background: #06C755; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }

        .board-wrapper { background: #d2a679; padding: 5px; border-radius: 10px; border: 3px solid #8b5a2b; width: 95vw; max-width: 450px; aspect-ratio: 1 / 1; margin-bottom: 15px; }
        #game-board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 2px; width: 100%; height: 100%; }
        .empty-space { background: transparent; }
        
        .cell { background-color: white; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; position: relative; color: #555; font-size: 12px; font-weight: bold;}
        
        .cell.red-start { background-color: #ff4444; color: white;}
        .cell.blue-start { background-color: #4444ff; color: white;}
        .cell.red-home { background-color: #ff9999; border: 2px solid #ff0000; }
        .cell.blue-home { background-color: #9999ff; border: 2px solid #0000ff; }
        
        .piece { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; position: absolute; z-index: 10; cursor: pointer; transition: transform 0.2s; }
        .piece.p1::after { content: '🐱'; }
        .piece.p2::after { content: '🐶'; }
        .piece.highlight { border: 2px solid yellow; border-radius: 50%; box-shadow: 0 0 15px yellow; transform: scale(1.2); animation: bounce 0.5s infinite alternate; }
        .piece.finished { filter: drop-shadow(0 0 5px gold); }

        @keyframes bounce { from { transform: scale(1.1); } to { transform: scale(1.3); } }

        .dice-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 400px; }
        .dice { width: 60px; height: 60px; background: white; border-radius: 10px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px; gap: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .dot { background: black; border-radius: 50%; width: 100%; height: 100%; display: none; }
        .dot.visible { display: block; }

        .home-pieces { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .home-piece { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 50%; border: 2px solid #fff; transition: 0.2s; background: #0f172a; }
        .home-piece.p1::after { content: '🐱'; }
        .home-piece.p2::after { content: '🐶'; }
        .home-piece.highlight { border: 2px solid yellow; box-shadow: 0 0 15px yellow; transform: scale(1.2); cursor: pointer; }

        #turn-text { font-size: 16px; font-weight: bold; color: #fbbf24; margin-bottom: 10px; text-align: center; }
        #game-msg { color: #94a3b8; font-size: 14px; margin-bottom: 10px; text-align: center; min-height: 20px; }

        /* 🚨 استایل دکمه‌های پایین صفحه */
        #controls {
            position: fixed; bottom: 20px; left: 20px; display: flex; gap: 10px; z-index: 100;
        }
        .control-btn {
            width: 50px; height: 50px; border-radius: 50%; font-size: 24px;
            background: #334155; border: 2px solid #94a3b8; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .control-btn.active { background: #ef4444; border-color: #fca5a5; animation: pulse 1.5s infinite; }

        /* 🚨 استایل کادر تماس تصویری */
        #video-container {
            position: fixed; top: 10px; right: 10px; width: 120px; height: 160px;
            background: #000; border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column; border: 2px solid #06C755;
            z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        /* تصویر حریف (بالا) */
        #remote-video { width: 100%; height: 50%; object-fit: cover; background: #1e293b; border-bottom: 1px solid #334155; }
        /* تصویر خودم (پایین) */
        #local-video { width: 100%; height: 50%; object-fit: cover; background: #1e293b; transform: scaleX(-1); /* آینه کردن تصویر خودم */ }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>

    <h1>🎲 بازی منچ آنلاین</h1>

    <div class="card" id="main-menu">
        <h2>اتصال به حریف</h2>
        <div id="my-id" style="font-size:20px; color:#06C755; margin-bottom:10px;">...</div>
        <div id="connect-section">
            <input type="text" id="opponent-id" placeholder="آیدی حریف" maxlength="4">
            <button onclick="sendRequest()">ارسال درخواست</button>
        </div>
        <div id="accept-section" class="hidden">
            <p style="margin-bottom:10px;">درخواست از طرف <span id="req-id" style="color:yellow;"></span></p>
            <button onclick="acceptRequest()">قبول</button>
        </div>
        <div id="status" style="margin-top:10px; font-size:14px;">در حال اتصال...</div>
    </div>

    <div id="game-area" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <div id="turn-text">نوبت شماست!</div>
        
        <div class="home-pieces" id="home-pieces-p1"></div>
        <div class="home-pieces" id="home-pieces-p2"></div>

        <div class="board-wrapper">
            <div id="game-board"></div>
        </div>
        
        <div class="dice-container">
            <div class="dice" id="dice-display">
                <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
                <div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div>
                <div class="dot" id="d7"></div><div class="dot" id="d8"></div><div class="dot" id="d9"></div>
            </div>
            <button onclick="rollDice()" id="roll-btn">انداختن تاس</button>
            <div id="game-msg">آماده شروع</div>
        </div>
    </div>

    <!-- 🚨 کادر تماس تصویری (مخفی در ابتدا) -->
    <div id="video-container" class="hidden">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <!-- 🚨 دکمه‌های کنترل (میکروفون و دوربین) -->
    <div id="controls">
        <div id="mic-btn" class="control-btn" onclick="toggleMic()" title="میکروفون">🎤</div>
        <div id="cam-btn" class="control-btn" onclick="toggleCam()" title="دوربین">📷</div>
    </div>

    <script>
        const socket = io("https://manch-server.onrender.com");
        let myId = null;
        let isMyTurn = false;
        let myPlayerNumber = 1; 
        let currentDice = 0;
        let hasRolled = false; 

        let pieces = { 1: [-1, -1, -1], 2: [-1, -1, -1] };

        const deletedCells = [37, 38, 39, 40, 41, 42, 43];
        const pathP1 = [4, 3, 12, 21, 30, 29, 28, 27, 36, 45, 46, 47, 48, 57, 66, 75, 76, 77, 68, 59, 50, 51, 52, 53, 44, 35, 34, 33, 32, 23, 14, 5, 13, 22, 31];
        const pathP2 = [77, 68, 59, 50, 51, 52, 53, 44, 35, 34, 33, 32, 23, 14, 5, 4, 3, 12, 21, 30, 29, 28, 27, 36, 45, 46, 47, 48, 57, 66, 75, 67, 58, 49];

        const startPointP1 = 4;
        const startPointP2 = 76;
        const totalPathLength = pathP1.length - 1; 

        const board = document.getElementById('game-board');

        // ساخت زمین
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            const row = Math.floor(i / 9);
            const col = i % 9;
            const isVertical = (col >= 3 && col <= 5);
            const isHorizontal = (row >= 3 && row <= 5);

            if (deletedCells.includes(i) || (!isVertical && !isHorizontal)) {
                cell.classList.add('empty-space');
            } else {
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.innerText = i; 
                if (i === startPointP1) cell.classList.add('red-start'); 
                if (i === startPointP2) cell.classList.add('blue-start');
                if (i === 31) cell.classList.add('red-home');
                if (i === 49) cell.classList.add('blue-home'); 
            }
            board.appendChild(cell);
        }

        // --- بخش شبکه و اتصال ---
        socket.on('your-id', (id) => { myId = id; document.getElementById('my-id').innerText = "آیدی شما: " + id; });
        function sendRequest() { socket.emit('request-connect', document.getElementById('opponent-id').value.trim()); }
        socket.on('incoming-request', (data) => {
            document.getElementById('connect-section').classList.add('hidden');
            document.getElementById('accept-section').classList.remove('hidden');
            document.getElementById('req-id').innerText = data.from;
            document.getElementById('accept-section').dataset.requester = data.from;
        });
        function acceptRequest() { socket.emit('accept-connect', document.getElementById('accept-section').dataset.requester); }

        socket.on('game-started', (data) => {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            if (data.requester === myId) { myPlayerNumber = 1; } else { myPlayerNumber = 2; }
            updateUI();
            if (data.turn === myId) {
                isMyTurn = true;
                document.getElementById('turn-text').innerText = "شما شروع می‌کنید! تاس بیندازید.";
                document.getElementById('roll-btn').disabled = false;
            } else {
                isMyTurn = false;
                document.getElementById('turn-text').innerText = "منتظر حرکت حریف...";
                document.getElementById('roll-btn').disabled = true;
            }
        });

        socket.on('game-over', (data) => {
            alert(`بازی تمام شد! ${data.winner === myId ? 'شما برنده شدید! 🎉' : 'حریف برنده شد! 😢'}`);
            location.reload();
        });

        socket.on('opponent-disconnected', () => {
            alert("حریف از بازی خارج شد! شما برنده شدید. 🎉");
            location.reload();
        });

        socket.on('turn-changed', (data) => {
            if (data.nextTurn === myId) {
                isMyTurn = true;
                hasRolled = false;
                document.getElementById('turn-text').innerText = "نوبت شماست! تاس بیندازید.";
                document.getElementById('roll-btn').disabled = false;
                document.getElementById('roll-btn').innerText = "انداختن تاس";
            } else {
                isMyTurn = false;
                document.getElementById('turn-text').innerText = "منتظر حرکت حریف...";
                document.getElementById('roll-btn').disabled = true;
            }
            updateUI();
        });

        // --- تاس و حرکت ---
        function updateDiceDisplay(number) {
            const dots = ['d1','d2','d3','d4','d5','d6','d7','d8','d9'];
            dots.forEach(d => document.getElementById(d).classList.remove('visible'));
            const patterns = { 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
            if (patterns[number]) patterns[number].forEach(pos => document.getElementById(`d${pos}`).classList.add('visible'));
        }

        function rollDice() {
            if (!isMyTurn || hasRolled) return;
            currentDice = Math.floor(Math.random() * 6) + 1;
            updateDiceDisplay(currentDice);
            hasRolled = true;
            document.getElementById('roll-btn').disabled = true;
            socket.emit('dice-rolled', { dice: currentDice });

            let canMove = false;
            const myPieces = pieces[myPlayerNumber];
            
            if (currentDice === 6 && myPieces.includes(-1)) { canMove = true; } 
            else {
                for (let pos of myPieces) {
                    if (pos !== -1 && pos !== totalPathLength && pos + currentDice <= totalPathLength) { canMove = true; break; }
                }
            }

            if (canMove) {
                document.getElementById('game-msg').innerText = `شما ${currentDice} آوردید. یک مهره انتخاب کنید.`;
                updateUI(); 
            } else {
                document.getElementById('game-msg').innerText = `شما ${currentDice} آوردید. حرکتی ممکن نیست!`;
                setTimeout(() => { socket.emit('end-turn', { dice: 1 }); }, 1500);
            }
        }

        socket.on('opponent-dice', (data) => {
            updateDiceDisplay(data.dice);
            document.getElementById('game-msg').innerText = `حریف ${data.dice} آورد.`;
        });

        function selectPiece(pieceIndex) {
            if (!isMyTurn || !hasRolled) return;
            const currentPos = pieces[myPlayerNumber][pieceIndex];

            if (currentPos === -1 && currentDice !== 6) return; 
            if (currentPos !== -1 && currentPos !== totalPathLength && currentPos + currentDice > totalPathLength) return; 

            let newPos = (currentPos === -1) ? 0 : currentPos + currentDice;
            if (newPos > totalPathLength) newPos = totalPathLength;

            pieces[myPlayerNumber][pieceIndex] = newPos;

            let opponentPlayerNum = (myPlayerNumber === 1) ? 2 : 1;
            let killedPieceIndex = -1;

            if (newPos < totalPathLength && newPos >= 0) {
                pieces[opponentPlayerNum].forEach((oppPos, oppIndex) => {
                    if (oppPos === newPos) {
                        pieces[opponentPlayerNum][oppIndex] = -1;
                        killedPieceIndex = oppIndex;
                    }
                });
            }

            socket.emit('make-move', { 
                player: myPlayerNumber, pieceIndex: pieceIndex, newPos: newPos,
                killed: { player: opponentPlayerNum, pieceIndex: killedPieceIndex, newPos: -1 }
            });

            let winCount = pieces[myPlayerNumber].filter(p => p === totalPathLength).length;
            if (winCount === 3) { socket.emit('end-turn', { winner: myPlayerNumber }); return; }

            if (currentDice === 6) socket.emit('end-turn', { dice: 6 }); 
            else socket.emit('end-turn', { dice: 1 }); 
        }

        socket.on('opponent-move', (data) => {
            pieces[data.player][data.pieceIndex] = data.newPos;
            if (data.killed && data.killed.pieceIndex !== -1) {
                pieces[data.killed.player][data.killed.pieceIndex] = -1;
            }
            updateUI();
        });

        function updateUI() {
            document.querySelectorAll('.piece').forEach(p => p.remove());
            for (let p = 1; p <= 2; p++) {
                const currentPath = (p === 1) ? pathP1 : pathP2;
                pieces[p].forEach((pos, index) => {
                    if (pos !== -1) {
                        let cellIndex = (pos >= currentPath.length) ? currentPath[currentPath.length - 1] : currentPath[pos];
                        const cell = document.querySelector(`.cell[data-index="${cellIndex}"]`);
                        if (cell) {
                            const pieceDiv = document.createElement('div');
                            pieceDiv.classList.add('piece', `p${p}`);
                            if (pos >= totalPathLength) pieceDiv.classList.add('finished');
                            if (p === myPlayerNumber && isMyTurn && hasRolled) {
                                if ((pos === -1 && currentDice === 6) || (pos !== totalPathLength && pos + currentDice <= totalPathLength)) pieceDiv.classList.add('highlight');
                            }
                            if (p === myPlayerNumber) pieceDiv.onclick = () => selectPiece(index);
                            cell.appendChild(pieceDiv);
                        }
                    }
                });
            }
            updateHomePieces();
        }

        function updateHomePieces() {
            for (let p = 1; p <= 2; p++) {
                const container = document.getElementById(`home-pieces-p${p}`);
                container.innerHTML = '';
                pieces[p].forEach((pos, index) => {
                    if (pos === -1) {
                        const hp = document.createElement('div');
                        hp.classList.add('home-piece', `p${p}`);
                        if (p === myPlayerNumber && isMyTurn && hasRolled && currentDice === 6) {
                            hp.classList.add('highlight');
                            hp.onclick = () => selectPiece(index);
                        }
                        container.appendChild(hp);
                    }
                });
            }
        }

        // ==========================================
        // 🎥 بخش WebRTC (تماس تصویری Peer-to-Peer)
        // ==========================================
        let localStream = null;
        let peerConnection = null;
        let isCamActive = false;
        let isMicActive = false;

        const configuration = { 
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
        };

        // روشن/خاموش کردن دوربین
        async function toggleCam() {
            const camBtn = document.getElementById('cam-btn');
            const videoContainer = document.getElementById('video-container');
            const localVideo = document.getElementById('local-video');

            if (!isCamActive) {
                try {
                    // درخواست دسترسی به دوربین و میکروفون همزمان
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    
                    localVideo.srcObject = localStream;
                    videoContainer.classList.remove('hidden');
                    camBtn.classList.add('active');
                    isCamActive = true;
                    isMicActive = true; // چون میکروفون هم روشن شده
                    document.getElementById('mic-btn').classList.add('active');

                    if (!peerConnection) createPeerConnection();

                    // اضافه کردن ویدیو و صدا به اتصال
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    // شروع تماس
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('webrtc-signal', { type: 'offer', sdp: offer });

                } catch (err) {
                    alert("دسترسی به دوربین امکان‌پذیر نیست. لطفاً دسترسی را بررسی کنید.");
                    console.error(err);
                }
            } else {
                // خاموش کردن دوربین و میکروفون
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = null;
                localVideo.srcObject = null;
                videoContainer.classList.add('hidden');
                camBtn.classList.remove('active');
                isCamActive = false;
                isMicActive = false;
                document.getElementById('mic-btn').classList.remove('active');
                
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }

        // روشن/خاموش کردن میکروفون (اگر دوربین روشن نباشه)
        async function toggleMic() {
            const micBtn = document.getElementById('mic-btn');

            if (!isMicActive) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micBtn.classList.add('active');
                    isMicActive = true;

                    if (!peerConnection) createPeerConnection();

                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('webrtc-signal', { type: 'offer', sdp: offer });

                } catch (err) {
                    alert("دسترسی به میکروفون امکان‌پذیر نیست.");
                }
            } else {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = null;
                micBtn.classList.remove('active');
                isMicActive = false;
                
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            // دریافت تصویر و صدای حریف
            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-signal', { type: 'candidate', candidate: event.candidate });
                }
            };
        }

        // دریافت پیام‌های WebRTC از سرور
        socket.on('webrtc-signal', async (data) => {
            if (!peerConnection) createPeerConnection();

            if (data.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc-signal', { type: 'answer', sdp: answer });
                
                // نمایش کادر ویدیو وقتی تماس ورودی داریم
                document.getElementById('video-container').classList.remove('hidden');
            } 
            else if (data.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } 
            else if (data.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });
    </script>
</body>
</html>
