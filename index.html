<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی منچ آنلاین (P2P)</title>
    <script src="https://manch-server.onrender.com/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #06C755; margin-bottom: 10px; font-size: 20px; }
        .card { background: #16213e; padding: 15px; border-radius: 15px; max-width: 400px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* استایل منو */
        .id-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #06C755; font-size: 20px; font-weight: bold; color: #06C755; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px; }
        button { background: #06C755; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { font-size: 14px; color: #94a3b8; margin-top: 10px; }
        .hidden { display: none !important; }

        /* --- استایل زمین منچ صلیبی (شبیه عکس) --- */
        .board-wrapper {
            background: #d2a679; /* رنگ پس‌زمینه زمین (شبیه عکس) */
            padding: 5px;
            border-radius: 10px;
            margin: 10px auto;
            border: 3px solid #8b5a2b;
            display: inline-block;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr); /* ۹ ستون */
            grid-template-rows: repeat(9, 1fr);    /* ۹ ردیف */
            gap: 2px;
            width: 300px;
            height: 300px;
        }

        /* خانه‌های خالی که روی صلیب نیستند */
        .empty-space { background: transparent; }

        /* دایره‌های روی زمین */
        .cell {
            background-color: white;
            border-radius: 50%;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* رنگ خانه‌های شروع و امن بر اساس عکس */
        .cell.red { background-color: #ff4444; }
        .cell.blue { background-color: #4444ff; }
        .cell.green { background-color: #44ff44; }
        .cell.yellow { background-color: #ffff44; }

        /* مهره‌ها */
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .piece.p1 { background-color: #ff0000; } /* بازیکن ۱ (قرمز) */
        .piece.p2 { background-color: #0000ff; } /* بازیکن ۲ (آبی) */

        /* بخش تاس */
        .dice-area { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; }
        .dice { width: 50px; height: 50px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: black; }
        #turn-text { font-size: 16px; font-weight: bold; color: #fbbf24; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🎲 بازی منچ آنلاین</h1>

    <!-- منوی اتصال -->
    <div class="card" id="main-menu">
        <h2>اتصال به حریف</h2>
        <p>آیدی شما:</p>
        <div id="my-id" class="id-box">...</div>
        <div id="connect-section">
            <input type="text" id="opponent-id" placeholder="آیدی حریف (مثلا 1234)" maxlength="4">
            <button onclick="sendRequest()">ارسال درخواست</button>
        </div>
        <div id="accept-section" class="hidden">
            <p style="color: #fbbf24; margin-bottom: 10px;">درخواست از طرف <span id="req-id"></span>!</p>
            <button onclick="acceptRequest()">قبول درخواست</button>
        </div>
        <div id="status">در حال اتصال...</div>
    </div>

    <!-- صفحه بازی -->
    <div class="card hidden" id="game-area">
        <div id="turn-text">نوبت شماست!</div>
        
        <!-- زمین بازی اینجا ساخته میشه -->
        <div class="board-wrapper">
            <div id="game-board"></div>
        </div>
        
        <div class="dice-area">
            <button onclick="rollDice()" id="roll-btn" style="width: auto; margin:0;">انداختن تاس</button>
            <div class="dice" id="dice-display">?</div>
        </div>
        <div id="game-msg" style="color: #94a3b8; font-size: 14px; margin-top: 10px;"></div>
    </div>

    <script>
        const socket = io("https://manch-server.onrender.com");
        let myId = null;
        let requesterId = null;
        let isMyTurn = false;
        let myPlayerNumber = 1; 
        let currentDice = 0;
        let lastRolled = false;

        const board = document.getElementById('game-board');
        
        // ساخت ۸۱ خانه (۹ در ۹) برای شبیه‌سازی صلیب
        // ما به صورت دستی تعیین می‌کنیم کدوم خونه خالیه و کدوم دایره بازی
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            
            // محاسبه سطر و ستون (از 0 تا 8)
            const row = Math.floor(i / 9);
            const col = i % 9;

            // منطق ساخت صلیب: خونه‌هایی که وسط یا بازوهای صلیب هستند
            const isVertical = (col >= 3 && col <= 5);
            const isHorizontal = (row >= 3 && row <= 5);

            if (!isVertical && !isHorizontal) {
                // این خونه‌ها روی صلیب نیستند (گوشه‌ها)
                cell.classList.add('empty-space');
            } else {
                // این خونه‌ها روی مسیر بازی هستند
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => makeMove(i));

                // رنگ‌آمیزی بر اساس نقشه عکس (ساده شده برای ۲ نفر)
                // بازوی بالا (آبی)
                if (col === 4 && (row === 0 || row === 1)) cell.classList.add('blue');
                // بازوی پایین (قرمز)
                if (col === 4 && (row === 7 || row === 8)) cell.classList.add('red');
                // بازوی چپ (قرمز)
                if (row === 4 && (col === 0 || col === 1)) cell.classList.add('red');
                // بازوی راست (آبی)
                if (row === 4 && (col === 7 || col === 8)) cell.classList.add('blue');
            }

            board.appendChild(cell);
        }

        // --- بخش شبکه و اتصال ---
        socket.on('your-id', (id) => {
            myId = id;
            document.getElementById('my-id').innerText = id;
            document.getElementById('status').innerText = "آماده. آیدی خود را به دوستتان بدهید.";
        });

        function sendRequest() {
            const opId = document.getElementById('opponent-id').value.trim();
            if (opId) socket.emit('request-connect', opId);
        }

        socket.on('incoming-request', (data) => {
            requesterId = data.from;
            document.getElementById('req-id').innerText = data.from;
            document.getElementById('connect-section').classList.add('hidden');
            document.getElementById('accept-section').classList.remove('hidden');
        });

        function acceptRequest() {
            socket.emit('accept-connect', requesterId);
        }

        socket.on('game-started', (data) => {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            
            if (data.requester === myId) {
                myPlayerNumber = 1;
                isMyTurn = true;
                document.getElementById('turn-text').innerText = "شما قرمز هستید. تاس بیندازید!";
                document.getElementById('roll-btn').disabled = false;
            } else {
                myPlayerNumber = 2;
                isMyTurn = false;
                document.getElementById('turn-text').innerText = "شما آبی هستید. منتظر حریف...";
                document.getElementById('roll-btn').disabled = true;
            }
        });

        // --- بخش تاس و حرکت ---
        function rollDice() {
            if (!isMyTurn || lastRolled) return;
            currentDice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-display').innerText = currentDice;
            document.getElementById('game-msg').innerText = `شما ${currentDice} آوردید. یک مهره را حرکت دهید.`;
            lastRolled = true;
            document.getElementById('roll-btn').disabled = true;
            socket.emit('dice-rolled', { dice: currentDice });
        }

        socket.on('opponent-dice', (data) => {
            document.getElementById('dice-display').innerText = data.dice;
            document.getElementById('game-msg').innerText = `حریف ${data.dice} آورد. منتظر حرکتش باشید...`;
        });

        function makeMove(index) {
            if (!isMyTurn || !lastRolled) return; 
            
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            // فقط اجازه بده روی خانه‌های خالی کلیک کنه
            if (!cell || cell.querySelector('.piece')) return; 

            applyMove(index, myPlayerNumber);
            socket.emit('make-move', { index: index, player: myPlayerNumber });
            
            isMyTurn = false;
            lastRolled = false;
            document.getElementById('turn-text').innerText = "منتظر حرکت حریف...";
            document.getElementById('roll-btn').disabled = true;
        }

        socket.on('opponent-move', (data) => {
            applyMove(data.index, data.player);
            isMyTurn = true;
            lastRolled = false;
            document.getElementById('turn-text').innerText = "نوبت شماست! تاس بیندازید.";
            document.getElementById('roll-btn').disabled = false;
        });

        function applyMove(index, playerNumber) {
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            if (!cell) return;
            const piece = document.createElement('div');
            piece.classList.add('piece');
            if (playerNumber === 1) {
                piece.classList.add('p1');
            } else {
                piece.classList.add('p2');
            }
            cell.appendChild(piece);
        }
    </script>
</body>
</html>
