<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست نهایی</title>
    <script src="https://manch-server.onrender.com/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Tahoma; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>آیدی شما:</h2>
    <div id="my-id" style="font-size: 28px; color: #06C755; font-weight: bold;">---</div>

    <div class="box">
        <h3>کاربران آنلاین:</h3>
        <ul id="users-list" style="list-style: none; padding: 0;">
            <li>در حال دریافت...</li>
        </ul>
    </div>

    <script>
        function getPersistentId() {
            let id = localStorage.getItem('manchPlayerId');
            if (!id) { id = Math.floor(1000 + Math.random() * 9000).toString(); localStorage.setItem('manchPlayerId', id); }
            return id;
        }
        const myId = getPersistentId();
        const socket = io("https://manch-server.onrender.com");

        socket.on('connect', () => {
            console.log("متصل شد!");
            socket.emit('register-user', myId);
        });

        socket.on('your-id', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        socket.on('online-users-list', (users) => {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            let found = false;
            users.forEach(u => {
                if (u.id !== myId) {
                    found = true;
                    const li = document.createElement('li');
                    li.innerText = `بازیکن ${u.id} (${u.status})`;
                    list.appendChild(li);
                }
            });
            if (!found) list.innerHTML = '<li>هیچ کاربر دیگری آنلاین نیست.</li>';
        });
    </script>
</body>
</html>
